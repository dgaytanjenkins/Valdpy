[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valdpy"
version = "0.1.1"
description = "Python SDK for VALD Performance APIs"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Danny Gaytan-Jenkins", email = "dgaytanj@uoregon.edu"}
]
keywords = ["vald", "performance", "forcedecks", "dynamo", "testing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Development Status :: 3 - Alpha",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
    "sphinx>=4.0",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
]

[project.urls]
"Homepage" = "https://github.com/dgaytanjenkins/Valdpy"
"Bug Reports" = "https://github.com/dgaytanjenkins/Valdpy/issues"
"Documentation" = "https://github.com/dgaytanjenkins/Valdpy#readme"
"Source Code" = "https://github.com/dgaytanjenkins/Valdpy"

[tool.setuptools]
packages = ["valdpy", "valdpy.api"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
